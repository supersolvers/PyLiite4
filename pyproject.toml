[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PyLiite4"
version = "0.2.0"
description = "Complete, typed Python bindings for GTK 4 and libadwaita"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING.GPL3"]
dependencies = ["PyGObject>=3.50"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "patchelf"]

[project.urls]
Homepage = "https://github.com/supersolvers/PyLiite4"
Issues = "https://github.com/supersolvers/PyLiite4/issues"
Releases = "https://github.com/supersolvers/PyLiite4/releases"

[project.scripts]
pyliite4-ui = "PyLiite4.tools.ui:main"
pyliite4-resources = "PyLiite4.tools.resources:main"
pyliite4-deploy = "PyLiite4.tools.deploy:main"

[project.entry-points.pyinstaller40]
hook-dirs = "PyLiite4.__pyinstaller:get_hook_dirs"

[project.entry-points.pytest11]
pyliite4 = "PyLiite4.testing"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
PyLiite4 = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
